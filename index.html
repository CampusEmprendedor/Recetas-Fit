<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas Fit — Campus Emprendedor</title>
<meta name="description" content="Las mismas recetas dulces que ya amás, en versión fit: sin azúcar, sin culpa, y listas para vender. Muy pronto en Campus Emprendedor.">
<meta property="og:title" content="Recetas Fit — Campus Emprendedor">
<meta property="og:description" content="Las mismas recetas dulces que ya amás, en versión fit: sin azúcar, sin culpa, y listas para vender.">
<meta property="og:type" content="website">
<style>
  :root{
    --gold:#c9a24a;
    --gold-dark:#9c7a2e;
    --gold-light:#f4e6c1;
    --ink:#241a0f;
    --ink-soft:#5a4d3c;
    --cream:#fbf6ec;
    --cream-alt:#f4ecd8;
    --card:#ffffff;
    --border:1px solid #ecdfc0;
    --shadow:0 12px 34px rgba(36,26,15,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at 80% 0%, var(--gold-light) 0%, var(--cream) 55%);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  h1,h2{font-family:Georgia,'Times New Roman',serif;line-height:1.15;}
  .card{
    background:var(--card);
    border:var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    max-width:560px;
    width:100%;
    padding:48px 40px;
    text-align:center;
  }
  .emoji{font-size:2.6rem;margin-bottom:14px;}
  .badge{
    display:inline-block;
    background:var(--gold-light);
    color:var(--gold-dark);
    font-size:.72rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:18px;
  }
  h1{font-size:2rem;color:var(--ink);margin-bottom:12px;}
  h1 span{color:var(--gold-dark);}
  p{color:var(--ink-soft);font-size:1.02rem;margin-bottom:8px;}
  .footer-note{
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid #ecdfc0;
    font-size:.88rem;
    color:var(--ink-soft);
  }
  .footer-note a{
    color:var(--gold-dark);
    text-decoration:none;
    font-weight:600;
  }
  .footer-note a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🍓</div>
    <div class="badge">Próximamente</div>
    <h1>Recetas <span>Fit</span></h1>
    <p>Las mismas recetas dulces que ya amás, en versión fit: sin azúcar, sin culpa, y listas para vender.</p>
    <p>Estamos terminando de armar este curso. Muy pronto vas a poder verlo completo, acá mismo.</p>
    <div class="footer-note">
      Un curso de <a href="https://campusemprendedor.com/">Campus Emprendedor</a>
    </div>
  </div>
</body>
</html>
